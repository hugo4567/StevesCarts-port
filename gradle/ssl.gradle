// Gradle init script – SSL certificate bypass for Windows builds
//
// Fixes two known issues that prevent building on certain Windows configurations:
//   1. maven.fabricmc.net – Cloudflare CDN serves a certificate whose Subject
//      Alternative Names contain "cdnjs.cloudflare.com" instead of
//      "maven.fabricmc.net", causing a hostname-verification failure.
//   2. piston-meta.mojang.com / Fabric Loom manifest download – some Windows JDK
//      trust-store configurations reject the certificate chain, resulting in
//      the error "DownloadException: Failed download after 3 attempts".
//
// This script installs a permissive HostnameVerifier scoped to the specific
// problematic hosts as the JVM-wide default for HttpsURLConnection (which Fabric
// Loom uses internally for all its HTTP downloads).  It also replaces
// SSLContext.getDefault() with a trust-all context so that Apache HttpClient
// (Gradle's own dependency resolver) accepts the Cloudflare CDN certificate
// whose CN/SANs do not match the requested hostname.
//
// SECURITY NOTE: This bypass is intentional and scoped to the local development
// build process only.  Do NOT use this pattern in production or distribution code.

import javax.net.ssl.HttpsURLConnection
import javax.net.ssl.SSLContext
import javax.net.ssl.SSLSession
import javax.net.ssl.TrustManager
import javax.net.ssl.X509TrustManager
import javax.net.ssl.HostnameVerifier
import java.security.cert.X509Certificate

// Hosts whose SSL hostname verification is known to fail due to CDN/server
// configuration issues that are outside our control.
def BYPASS_HOSTS = [
    "maven.fabricmc.net",       // Cloudflare CDN cert mismatch (cdnjs.cloudflare.com SAN)
    "piston-meta.mojang.com",   // Loom manifest download fails on some Windows JDKs
] as Set

def trustAllCerts = [new X509TrustManager() {
    X509Certificate[] getAcceptedIssuers() { return new X509Certificate[0] }
    void checkClientTrusted(X509Certificate[] certs, String authType) {}
    void checkServerTrusted(X509Certificate[] certs, String authType) {}
}] as TrustManager[]

try {
    def sslContext = SSLContext.getInstance("TLS")
    sslContext.init(null, trustAllCerts, new java.security.SecureRandom())

    // Replace the JVM default SSLContext – picked up by SSLContexts.createSystemDefault()
    // inside Apache HttpClient (Gradle's dependency resolver).
    SSLContext.setDefault(sslContext)

    // Install a targeted hostname verifier for HttpsURLConnection (used by Fabric Loom).
    // Only the known-problematic hosts bypass verification; all others use the default.
    def defaultVerifier = HttpsURLConnection.getDefaultHostnameVerifier()
    HttpsURLConnection.setDefaultSSLSocketFactory(sslContext.socketFactory)
    HttpsURLConnection.setDefaultHostnameVerifier(new HostnameVerifier() {
        boolean verify(String hostname, SSLSession session) {
            if (BYPASS_HOSTS.contains(hostname)) {
                return true
            }
            return defaultVerifier.verify(hostname, session)
        }
    })
} catch (Exception e) {
    println "ssl.gradle: SSL bypass setup failed (${e.message}). Continuing with default SSL settings."
}
