plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    // HTTP FIRST - Workaround for SSL certificate issues with maven.fabricmc.net
    maven {
        name = "FabricHTTP"
        url = "http://maven.fabricmc.net/"
        allowInsecureProtocol = true
    }
    mavenCentral()
    
    // CurseForge Maven for LibGui
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    
    // Shedaniel for LibGui (alternative)
    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me/"
    }
    
    // TerraformersMC for LibGui (alternative)
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
    }
    
    maven {
        name = "BuildCraft"
        url = "https://mod-buildcraft.com/maven"
        content {
            includeGroup "alexiil.mc.lib"
        }
    }
    maven {
        name = "TechReborn"
        url = "https://maven.techreborn.dev/"
        content {
            includeGroup "TechReborn"
        }
    }
    // CottonMC for LibNinePatch and Jankson
    maven {
        name = "CottonMC"
        url = "https://server.bbkr.space/artifactory/libs-release"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    
    // LibGui for GUI with its dependencies (extracted from JAR-in-JAR)
    modImplementation files("libs/LibGui-5.4.0+1.18.2.jar")
    modImplementation files("libs/Jankson-Fabric-4.0.0+j1.2.0.jar")
    modImplementation files("libs/libninepatch-1.1.0.jar")
    implementation files("libs/jankson-blue-1.2.1.jar")  // Core jankson library (blue.endless.jankson)
    
    // LibBlockAttributes for fluid handling
    modImplementation include("alexiil.mc.lib:libblockattributes-core:0.10.0")
    modImplementation include("alexiil.mc.lib:libblockattributes-fluids:0.10.0")
}

sourceSets {
    main {
        java {
            srcDirs = ["src/main/java"]
        }
        resources {
            srcDirs += ["src/main/generated"]
        }
    }
}

loom {
    runs {
        datagenClient {
            client()
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.strict-validation"

            ideConfigGenerated = true
            runDir "build/datagen"
            source sourceSets.main
        }
    }

    accessWidenerPath = file("src/main/resources/stevescarts.accesswidener")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}"}
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
