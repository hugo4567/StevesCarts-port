# Done to increase the memory available to gradle.
# DÉSACTIVATION SSL - Workaround pour maven.fabricmc.net certificat invalide
org.gradle.jvmargs=-Xmx5G -Djavax.net.ssl.trustAllCertificates=true -Dcom.sun.net.ssl.checkRevocation=false -Dhttps.protocols=TLSv1,TLSv1.1,TLSv1.2,TLSv1.3

systemProp.jsse.enableSNIExtension=false
systemProp.sun.security.ssl.allowUnsafeRenegotiation=true
systemProp.sun.security.ssl.allowLegacyHelloMessages=true

# Fabric Properties
	# check these on https://fabricmc.net/develop
	minecraft_version=1.19.2
	yarn_mappings=1.19.2+build.28
	loader_version=0.13.3

# Mod Properties
	mod_version = 3.0.0
	maven_group = vswe.stevescarts
	archives_base_name = StevesCarts

# Dependencies
	fabric_version=0.76.0+1.19.2
