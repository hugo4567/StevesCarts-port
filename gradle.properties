# Done to increase the memory available to gradle.
# SSL workarounds for Windows builds:
#   - Restrict to modern TLS protocols only (removes deprecated TLSv1/TLSv1.1 that
#     some servers reject, which can manifest as "unrecognized_name" TLS alerts).
#   - Prefer IPv4 to avoid IPv6 routing issues on some Windows configurations.
#   - The gradle/ssl.gradle init script (applied automatically by gradlew/gradlew.bat)
#     installs a trust-all SSL context and hostname verifier that fixes certificate
#     mismatch errors from maven.fabricmc.net (Cloudflare CDN) and Loom downloads.
org.gradle.jvmargs=-Xmx5G -Dhttps.protocols=TLSv1.2,TLSv1.3 -Djava.net.preferIPv4Stack=true

# Disable SNI extension – fixes "unrecognized_name" TLS alert from server.bbkr.space
# (CottonMC Artifactory) on Windows JDKs where the server rejects the SNI value.
systemProp.jsse.enableSNIExtension=false

# Fabric Properties
	# check these on https://fabricmc.net/develop
	minecraft_version=1.19.2
	yarn_mappings=1.19.2+build.28
	loader_version=0.13.3

# Mod Properties
	mod_version = 3.0.0
	maven_group = vswe.stevescarts
	archives_base_name = StevesCarts

# Dependencies
	fabric_version=0.76.0+1.19.2
