# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G

# Fabric Properties
	# check these on https://fabricmc.net/develop
	minecraft_version=1.18.2
	yarn_mappings=1.18.2+build.4
	loader_version=0.13.3

# Mod Properties
	mod_version = 3.0.0
	maven_group = vswe.stevescarts
	archives_base_name = StevesCarts

# Dependencies
	fabric_version=0.58.5+1.18.2

# Force Gradle to use TLS 1.2+
systemProp.javax.net.ssl.trustStoreType=JKS
systemProp.javax.net.ssl.trustStorePassword=changeit
systemProp.javax.net.ssl.trustStore=path/to/your/truststore.jks
