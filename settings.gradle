pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven { url = uri("https://maven.fabricmc.net/") }
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'Minecraft'
            url = 'https://libraries.minecraft.net/'
        }
        maven {
            name = 'PaperMC'
            url = 'https://repo.papermc.io/repository/maven-public/'
        }
        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
        }
        mavenLocal()
        // HTTP fallback for maven.fabricmc.net – used when the ssl.gradle SSLContext
        // patch does not fully override Apache HttpClient's DefaultHostnameVerifier.
        maven {
            name = 'FabricHTTP'
            url = 'http://maven.fabricmc.net/'
            allowInsecureProtocol = true
        }
    }
}
rootProject.name = 'StevesCarts-1.19'
